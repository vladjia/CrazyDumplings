<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FF7A1A">
  <meta name="background-color" content="#F6E7D2">

  <title>Crazy瘋水餃｜現貨公告產生器</title>
  <meta name="description" content="Crazy瘋水餃現貨公告產生器">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="瘋水餃">

  <!-- Favicon / App Icons -->
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

  <!-- Cover / Social preview -->
  <meta property="og:title" content="Crazy瘋水餃｜現貨公告產生器">
  <meta property="og:description" content="Crazy瘋水餃現貨公告產生器">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./gs-cover.png">

  <style>
    :root{
      --orange:#FF7A1A;
      --brown:#35241E;
      --cream:#F6E7D2;

      /* Google Apps Script 上方那條的遮罩高度。
         如果之後 Google 改高度，只改這個數字。 */
      --gs-cover-h:40px;
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--cream);
      overscroll-behavior:none;
      font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    }

    /* iframe 往上推，把 GAS 上方 Google 條裁掉 */
    #appFrame{
      position:fixed;
      left:0;
      top:calc(-1 * var(--gs-cover-h));
      width:100%;
      height:calc(100% + var(--gs-cover-h));
      border:0;
      display:block;
      background:var(--cream);
    }

    /* GS-COVER：專門蓋住 iframe 最上面的 Google 區域 */
    #gs-cover{
      position:fixed;
      z-index:30;
      top:0;
      left:0;
      right:0;
      height:env(safe-area-inset-top, 0px);
      min-height:0;
      background:var(--cream);
      pointer-events:none;
    }

    /* 初始品牌 Cover，iframe 載完才退場 */
    #loadingCover{
      position:fixed;
      inset:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--cream);
      transition:opacity .28s ease,visibility .28s ease;
    }

    #loadingCover.hide{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    #loadingCover img{
      width:min(92vw,760px);
      height:auto;
      max-height:74vh;
      object-fit:contain;
      border-radius:22px;
      filter:drop-shadow(0 18px 42px rgba(53,36,30,.10));
    }

    #loadingText{
      position:absolute;
      bottom:calc(22px + env(safe-area-inset-bottom));
      left:50%;
      transform:translateX(-50%);
      font-size:12px;
      font-weight:900;
      letter-spacing:.05em;
      color:var(--brown);
      white-space:nowrap;
    }

    #fallback{
      position:fixed;
      z-index:60;
      right:12px;
      bottom:calc(12px + env(safe-area-inset-bottom));
      display:none;
      border:0;
      border-radius:999px;
      padding:9px 13px;
      background:rgba(53,36,30,.92);
      color:#fff;
      text-decoration:none;
      font-size:12px;
      font-weight:900;
    }

    @media (display-mode: standalone){
      body{user-select:none}
    }
  </style>
</head>

<body>
  <iframe
    id="appFrame"
    title="Crazy瘋水餃｜現貨公告產生器"
    allow="clipboard-read; clipboard-write; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <div id="gs-cover" aria-hidden="true"></div>

  <div id="loadingCover">
    <img src="./gs-cover.png" alt="Crazy瘋水餃">
    <div id="loadingText">現貨公告產生器載入中…</div>
  </div>

  <a id="fallback" target="_blank" rel="noopener">直接開啟</a>

  <script>
    // ============================================================
    // GAS 部署後，只要把 /exec 網址貼在這一行。
    // ============================================================
    const GAS_WEB_APP_URL = "PASTE_YOUR_GAS_WEB_APP_EXEC_URL_HERE";

    // 這個 GitHub 專案固定只開 StockNotice.html。
    const PAGE_KEY = "stock";

    const frame = document.getElementById("appFrame");
    const cover = document.getElementById("loadingCover");
    const fallback = document.getElementById("fallback");

    function buildGasUrl(){
      const gas = new URL(GAS_WEB_APP_URL);
      gas.searchParams.set("page", PAGE_KEY);

      // GitHub URL 上若有其他參數，可繼續轉給 GAS；
      // 但 page 永遠鎖 stock，不會誤開未來其他頁面。
      const here = new URL(location.href);
      here.searchParams.forEach((value,key)=>{
        if(key !== "page") gas.searchParams.set(key,value);
      });

      return gas.toString();
    }

    try{
      const target = buildGasUrl();
      frame.src = target;
      fallback.href = target;

      frame.addEventListener("load",()=>{
        setTimeout(()=>cover.classList.add("hide"),120);
      });

      setTimeout(()=>{
        if(!cover.classList.contains("hide")){
          fallback.style.display = "block";
        }
      },8000);
    }catch(err){
      document.getElementById("loadingText").textContent =
        "尚未設定 GAS Web App 網址";
      fallback.style.display = "none";
    }

    // PWA Service Worker
    if("serviceWorker" in navigator){
      window.addEventListener("load",()=>{
        navigator.serviceWorker.register("./sw.js").catch(()=>{});
      });
    }
  </script>
</body>
</html>
